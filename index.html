<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoodBit settings</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf2f3;background:#111b28}body{margin:0 auto;max-width:520px;padding:24px}h1{font-size:32px;margin-bottom:4px}p,small{color:#a8bdc9}.card{background:#1b2a3a;border:1px solid #304454;border-radius:18px;padding:18px;margin:16px 0}label{display:block;margin:14px 0 7px}select,input,button{font:inherit;border-radius:10px;padding:12px;background:#263a4d;color:white;border:1px solid #536878;width:100%;box-sizing:border-box}button{background:#79d6b8;color:#102522;font-weight:700;border:0;margin-top:10px}button.danger{background:#5b2a37;color:#ffd8db}.entry{display:flex;justify-content:space-between;border-bottom:1px solid #35495b;padding:12px 0}.face{font-size:24px}.tag{color:#79d6b8} input[type="time"]{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;}
</style></head><body><h1>☺ MoodBit</h1><p>Check in with yourself, one moment at a time.</p><div class="card"><h2>Reminder settings</h2><label for="interval">Remind me every</label><select id="interval"><option value="0">None</option><option value="3">3 hours</option><option value="4">4 hours</option><option value="5">5 hours</option><option value="6">6 hours</option><option value="8">8 hours</option><option value="10">10 hours</option></select><label for="start">First reminder</label><input id="start" type="time" value="09:00"><label><input id="quiet" type="checkbox" style="width:auto"> Quiet after 10 PM</label><small>Timeline publishing requires a connected scheduling backend. These controls store your preferences.</small></div><div class="card"><h2>Mood history <span id="count" class="tag"></span></h2><div id="entries"></div><button class="danger" id="delete">Delete all records</button></div><button id="save">Save settings</button><script>
const params=new URLSearchParams(location.search);let s={interval:4,start:'09:00',quiet:true},entries=[];try{s=Object.assign(s,JSON.parse(params.get('settings')||'{}'));entries=JSON.parse(params.get('entries')||'[]')}catch(e){};
const $=id=>document.getElementById(id);$('interval').value=String(s.interval);$('start').value=s.start;$('quiet').checked=!!s.quiet;
const names=['','Terrible','Bad','OK','Great','Awesome'],icons=['','☹','⌢','•','☺','☻'];
function render(){ $('count').textContent=entries.length; $('entries').innerHTML='';entries.slice().reverse().slice(0,50).forEach(e=>{let el=document.createElement('div');el.className='entry';let date=document.createElement('span');date.textContent=new Date(e.timestamp*1000).toLocaleString();let mood=document.createElement('strong');mood.textContent=icons[e.mood]+' '+names[e.mood];el.append(mood,date);$('entries').append(el)});if(!entries.length)$('entries').textContent='No mood logs yet.';}
render();let deleted=false;$('delete').onclick=()=>{if(confirm('Permanently delete all recorded moods?')){entries=[];deleted=true;render()}};
$('save').onclick=()=>{let result={settings:{interval:Number($('interval').value),start:$('start').value,quiet:$('quiet').checked},deleteAll:deleted};location.href='pebblejs://close#'+encodeURIComponent(JSON.stringify(result));};
</script></body></html>
